spring.application.name=JWT_Nimbus_SpringBoot3
server.port=8005
spring.datasource.url=jdbc:h2:file:./data/jwt_nimbus
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret-key=${JWT_SECRET_BASE64:}
security.jwt.expiration-time=3600000
security.jwt.issuer=jwt-nimbus-demo
security.jwt.audience=jwt-nimbus-client
server.error.include-message=never
